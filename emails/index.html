ayment failed</strong> <code>syndicate_payment_failed</code><br><span>We could not take your US Powerball syndicate payment</span></figcaption><iframe src="preview/syndicate_payment_failed.html" loading="lazy" title="Syndicate payment failed"></iframe></figure><figure><figcaption><strong>Syndicate cancelled</strong> <code>syndicate_cancelled</code><br><span>Your US Powerball syndicate membership is cancelled</span></figcaption><iframe src="preview/syndicate_cancelled.html" loading="lazy" title="Syndicate cancelled"></iframe></figure></div><h2>Reminders and alerts</h2><div class="grid"><figure><figcaption><strong>Lines left in the cart</strong> <code>cart_reminder</code><br><span>Your EuroMillions lines are still in your cart</span></figcaption><iframe src="preview/cart_reminder.html" loading="lazy" title="Lines left in the cart"></iframe></figure><figure><figcaption><strong>Last call for the cart</strong> <code>cart_last_call</code><br><span>EuroMillions closes Fri 9 Oct 2026 at 18:30 (UTC)</span></figcaption><iframe src="preview/cart_last_call.html" loading="lazy" title="Last call for the cart"></iframe></figure><figure><figcaption><strong>Jackpot alert</strong> <code>jackpot_alert</code><br><span>EuroMillions: €150 Million</span></figcaption><iframe src="preview/jackpot_alert.html" loading="lazy" title="Jackpot alert"></iframe></figure></div></body></html>
