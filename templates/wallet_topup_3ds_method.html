{% extends "base.html" %}
{% block content %}
<div class="noSelect container lePages">
  <h1 class="pageHeading">Processing secure card check</h1>
  <p>Please wait while we complete your card verification.</p>

  <iframe name="threeds_iframe" title="3DS method iframe" style="display:none; width:0; height:0; border:0;"></iframe>

  <form id="threedsMethodForm" method="post" action="{{ threeds_method_action_url }}" target="threeds_iframe" style="display:none;">
    <input type="hidden" name="unique_id" value="{{ threeds_method_unique_id }}">
    <input type="hidden" name="signature" value="{{ threeds_method_signature }}">
  </form>

  <form id="threedsContinueForm" method="post" action="{{ url_for('wallet_topup_emerchant_3ds_method_continue', intent_id=intent_id) }}" style="display:none;">
    <input type="hidden" name="next" value="{{ next or '' }}">
  </form>

  <p class="footnote">Reference: {{ intent_id }}</p>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function run3DSMethodFlow() {
  var methodForm = document.getElementById("threedsMethodForm");
  var continueForm = document.getElementById("threedsContinueForm");
  if (!methodForm || !continueForm) return;
  try { methodForm.submit(); } catch (e) {}
  window.setTimeout(function () {
    try { continueForm.submit(); } catch (e2) {}
  }, 250);
})();
</script>
{% endblock %}
