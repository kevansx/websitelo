{# Installable web app: manifest + iPhone home-screen tags + the add-to-home-screen styles + CSRF token for the
   free-ticket claim. Included by both layouts. #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LottosOnline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="csrf-token" content="{{ csrf_token() }}">
{% if lo_push.enabled %}<meta name="lo-push-key" content="{{ lo_push.key }}">{% endif %}
<link rel="stylesheet" href="{{ lo_asset('css/install.css') }}">
