{% extends "lo/base.html" %}
{% from "lo/_auth_shell.html" import shell %}
{% block content %}
{% call shell("Email Verification") %}
  <div class="lo-flash {{ 'lo-flash--success' if verify_success else 'lo-flash--error' }}" role="status" style="margin-top:0">{{ verify_message }}</div>
  {% if customer %}
    <a class="lo-btn lo-btn--block" href="{{ url_for('account') }}">Go to My Account</a>
  {% else %}
    <a class="lo-btn lo-btn--block" href="{{ url_for('login') }}">Go to Login</a>
  {% endif %}
{% endcall %}
{% endblock %}
